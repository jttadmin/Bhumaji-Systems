name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Leave as "/" for a custom domain (bhumaji.com) or a username.github.io repo.
          # For https://<user>.github.io/<repo>/ set a repository variable BASE_PATH to "/<repo>/".
          BASE_PATH: ${{ vars.BASE_PATH || '/' }}
          # Set a repository variable CHAT_API_URL to the whatsapp-bridge Worker URL to switch on live chat.
          VITE_CHAT_API_URL: ${{ vars.CHAT_API_URL }}
          # Web3Forms access key for the enquiry form (repository variable WEB3FORMS_KEY).
          VITE_WEB3FORMS_KEY: ${{ vars.WEB3FORMS_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
